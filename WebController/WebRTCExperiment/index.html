<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NaWaBa · WebRTC LAN 실험</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111b25; color: #edf3f8; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 1320px; margin: auto; padding: 24px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { margin: 8px 0; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #050a0f; object-fit: contain; margin: 18px 0; }
    button { padding: 10px 18px; border: 0; border-radius: 6px; font: inherit; cursor: pointer; margin: 8px 8px 8px 0; }
    #connect { background: #8ce5bc; color: #102b20; }
    button:disabled { opacity: .5; cursor: default; }
    #stats { font-family: monospace; color: #a9c8e0; }
    small { color: #b2c0ce; }
  </style>
</head>
<body>
<main>
  <h1>NaWaBa · WebRTC LAN 실험</h1>
  <p>Unity에서 <b>OFFER READY</b>가 표시되면 영상 받기를 누르세요.</p>
  <button id="connect">영상 받기</button><button id="disconnect">수신 종료</button>
  <button id="play" hidden>영상 재생</button>
  <p id="status" role="status">수신 대기 · 같은 공유기에 연결된 호스트 PC의 Unity에 연결합니다.</p>
  <video id="video" autoplay muted playsinline></video>
  <p id="stats">수신 정보 대기</p>
  <small>목표 설정: 1280 × 720 / 최대 30fps / 영상만 전송. 재연결은 Unity의 New Session → 이 페이지의 영상 받기 순서입니다.<br>
  표시되는 FPS와 비트레이트는 수신 통계이며, 입력부터 화면 표시까지의 지연을 뜻하지 않습니다.</small>
</main>
<script>
"use strict";
const video = document.getElementById("video");
const statusText = document.getElementById("status");
const statsText = document.getElementById("stats");
const connectButton = document.getElementById("connect");
const playButton = document.getElementById("play");
const viewToken = new URLSearchParams(location.hash.slice(1)).get("view") || "";
let peer = null;
let generation = 0;
let lastStats = null;
let statsBusy = false;

async function api(route, body) {
    if (!/^[a-f0-9]{48}$/.test(viewToken))
        throw new Error("서버에 출력된 전체 링크(#view= 포함)로 접속하세요.");
    const response = await fetch(route, {
        method: body === undefined ? "GET" : "POST", cache: "no-store",
        headers: { "X-NaWaBa-View-Token": viewToken,
            ...(body === undefined ? {} : { "Content-Type": "application/json" }) },
        body: body === undefined ? undefined : JSON.stringify(body),
        signal: AbortSignal.timeout(10000)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
    return result;
}

function clearPeer() {
    generation++;
    if (peer) { peer.ontrack = null; peer.onconnectionstatechange = null; peer.close(); }
    peer = null;
    if (video.srcObject) video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
    lastStats = null;
    playButton.hidden = true;
    statsText.textContent = "수신 정보 대기";
    connectButton.disabled = false;
}

async function waitForIce(pc) {
    const deadline = performance.now() + 10000;
    while (pc.iceGatheringState !== "complete") {
        if (pc.signalingState === "closed") throw new Error("연결이 취소되었습니다.");
        if (performance.now() > deadline) throw new Error("ICE 수집 시간 초과");
        await new Promise(resolve => setTimeout(resolve, 50));
    }
}

async function playVideo() {
    const current = peer;
    try { await video.play(); if (peer === current) playButton.hidden = true; }
    catch { if (peer === current && current) playButton.hidden = false; }
}
playButton.addEventListener("click", playVideo);

connectButton.addEventListener("click", async () => {
    clearPeer();
    const currentGeneration = generation;
    connectButton.disabled = true;
    statusText.textContent = "Unity의 연결 정보 확인 중…";
    try {
        const offer = await api("/api/offer");
        if (currentGeneration !== generation) return;
        if (!offer.session || !offer.sdp) throw new Error("Unity의 OFFER READY 표시를 기다린 뒤 다시 누르세요.");
        if (offer.answered) throw new Error("Unity에서 New Session을 누르고 OFFER READY가 된 뒤 다시 누르세요.");
        const pc = new RTCPeerConnection({ iceServers: [] });
        peer = pc;
        pc.ontrack = event => {
            if (peer !== pc) return;
            video.srcObject = event.streams[0] || new MediaStream([event.track]);
            void playVideo();
        };
        pc.onconnectionstatechange = () => {
            if (peer !== pc) return;
            statusText.textContent = `WebRTC: ${pc.connectionState}` +
                (["failed", "disconnected"].includes(pc.connectionState) ? " · Unity에서 New Session 후 다시 연결하세요." : "");
            if (pc.connectionState === "failed") connectButton.disabled = false;
        };
        statusText.textContent = "WebRTC 연결 준비 중…";
        await pc.setRemoteDescription({ type: "offer", sdp: offer.sdp });
        if (peer !== pc) return;
        await pc.setLocalDescription(await pc.createAnswer());
        await waitForIce(pc);
        if (peer !== pc) return;
        await api("/api/answer", { session: offer.session, sdp: pc.localDescription.sdp });
        if (peer !== pc) return;
        statusText.textContent = `WebRTC: ${pc.connectionState} · 영상 수신 대기`;
    } catch (error) {
        if (currentGeneration !== generation) return;
        clearPeer();
        statusText.textContent = `연결 실패: ${error.message}`;
    } finally {
        if (currentGeneration === generation) connectButton.disabled = false;
    }
});

document.getElementById("disconnect").addEventListener("click", () => {
    clearPeer();
    statusText.textContent = "수신 종료 · 재연결하려면 Unity에서 New Session을 먼저 누르세요.";
});
window.addEventListener("pagehide", clearPeer);

setInterval(async () => {
    const pc = peer;
    if (!pc || statsBusy || pc.connectionState !== "connected") return;
    statsBusy = true;
    try {
        const report = await pc.getStats();
        if (peer !== pc) return;
        for (const stat of report.values()) {
            if (stat.type !== "inbound-rtp" || (stat.kind || stat.mediaType) !== "video") continue;
            const elapsed = lastStats ? (stat.timestamp - lastStats.timestamp) / 1000 : 0;
            const fps = stat.framesPerSecond ?? (elapsed > 0 ? (stat.framesDecoded - lastStats.framesDecoded) / elapsed : null);
            const mbps = elapsed > 0 ? (stat.bytesReceived - lastStats.bytesReceived) * 8 / elapsed / 1000000 : null;
            const codec = report.get(stat.codecId)?.mimeType || "codec 확인 중";
            statsText.textContent = `${stat.frameWidth || video.videoWidth} × ${stat.frameHeight || video.videoHeight} | ` +
                `${Number.isFinite(fps) ? fps.toFixed(1) : "—"} fps | ` +
                `${Number.isFinite(mbps) ? mbps.toFixed(2) : "—"} Mbps | ${codec}`;
            lastStats = stat;
        }
    } catch { /* A peer can be closed while getStats is pending. */ }
    finally { statsBusy = false; }
}, 1000);
</script>
</body>
</html>
