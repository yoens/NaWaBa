<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NaWaBa 입력 실험장</title>
    <style>
        * { box-sizing: border-box; }
        body { max-width: 600px; margin: 40px auto; padding: 24px; font-family: sans-serif;
            background: #17212b; color: #eef3f8; line-height: 1.7; }
        h1 { font-size: 28px; }
        label { display: block; margin-bottom: 6px; }
        input, button { font: inherit; border-radius: 6px; padding: 10px 14px; }
        input { width: 100%; margin-bottom: 12px; }
        button { cursor: pointer; border: 1px solid #7393ad; background: #263e52;
            color: #eef3f8; margin: 0 8px 8px 0; }
        button:disabled { opacity: .4; cursor: not-allowed; }
        button:focus-visible, input:focus-visible { outline: 3px solid #80d8ff; outline-offset: 3px; }
        #input { padding: 16px; background: #263646; font-family: monospace; }
        .hint { color: #b4c8d8; font-size: 14px; }
    </style>
</head>
<body>
    <h1>NaWaBa 입력 실험장</h1>
    <p>신청하고 호스트의 승인을 받은 뒤, 조작 시작을 누르세요.</p>
    <label for="nickname">닉네임 (1~20자)</label>
    <input id="nickname" maxlength="20" autocomplete="off" placeholder="예: Yeonsu">
    <button id="request" disabled>조작 신청</button>
    <p id="requestStatus" role="status">서버 연결 중…</p>
    <button id="start" disabled>조작 시작</button>
    <button id="stop" disabled>조작 중지</button>
    <p id="status" role="status">승인 전에는 입력을 보낼 수 없습니다.</p>
    <p id="input">x=0, y=0</p>
    <p class="hint">WASD 또는 방향키로 조작합니다. 조작 중 다른 창·탭으로 이동하면 권한을 반환합니다.
        다시 조작하려면 새로 신청하세요. 승인 후 15초 안에 시작하세요.</p>
    <script>
        "use strict";
        const nicknameInput = document.getElementById("nickname");
        const requestButton = document.getElementById("request");
        const requestStatus = document.getElementById("requestStatus");
        const startButton = document.getElementById("start");
        const stopButton = document.getElementById("stop");
        const statusText = document.getElementById("status");
        const inputText = document.getElementById("input");
        const socket = new WebSocket(`${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/controller`);
        const keys = new Set();
        const moveKeys = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight"]);
        let connected = false;
        let hostOnline = false;
        let controllerId = "";
        let requestId = "";
        let grantId = "";
        let phase = "idle"; // idle -> requesting -> pending -> approved -> starting -> active
        let sequence = 0;
        const reasons = {
            host_reclaimed: "호스트가 조작 권한을 회수했습니다.",
            controller_stopped: "조작을 중지했습니다.",
            controller_disconnected: "참가자 연결이 종료되었습니다.",
            host_disconnected: "Unity 연결을 확인한 뒤 다시 신청하세요.",
            connection_lost: "연결이 끊겨 권한을 반환했습니다.",
            request_timeout: "30초 동안 승인되지 않아 신청이 만료되었습니다.",
            ready_timeout: "승인 후 15초 안에 시작하지 않아 권한이 만료되었습니다.",
            input_timeout: "입력 전송이 끊겨 권한을 반환했습니다.",
            invalid_nickname: "닉네임은 1~20자로 입력하세요.",
            invalid_input: "올바르지 않은 입력으로 조작이 종료되었습니다."
        };

        function renderButtons() {
            requestButton.disabled = !connected || !hostOnline || phase !== "idle";
            nicknameInput.disabled = phase !== "idle";
            startButton.disabled = !connected || phase !== "approved";
            stopButton.disabled = !connected || !["approved", "starting", "active"].includes(phase);
        }
        function clearControl() {
            phase = "idle";
            requestId = "";
            grantId = "";
            keys.clear();
            sequence = 0;
            inputText.textContent = "x=0, y=0";
            renderButtons();
        }
        function send(type, extra = {}) {
            if (!connected || socket.readyState !== WebSocket.OPEN) return false;
            if (socket.bufferedAmount > 4096) {
                connected = false;
                clearControl();
                statusText.textContent = "전송 지연: 연결을 종료합니다. 새로고침하세요.";
                socket.close();
                return false;
            }
            socket.send(JSON.stringify({ protocolVersion: 2, type, ...extra }));
            return true;
        }
        function identity() { return { controllerId, requestId, grantId }; }
        function sameRequest(message) {
            return message.controllerId === controllerId && !!requestId && message.requestId === requestId;
        }
        function sendInput() {
            if (phase !== "active") return;
            const left = keys.has("KeyA") || keys.has("ArrowLeft");
            const right = keys.has("KeyD") || keys.has("ArrowRight");
            const back = keys.has("KeyS") || keys.has("ArrowDown");
            const forward = keys.has("KeyW") || keys.has("ArrowUp");
            const x = Number(right) - Number(left);
            const y = Number(forward) - Number(back);
            if (send("input", { ...identity(), sequence: ++sequence, x, y })) {
                inputText.textContent = `x=${x}, y=${y} / 전송 번호: ${sequence}`;
            }
        }
        function stopControl(reason) {
            const previous = identity();
            const hadGrant = !!grantId;
            clearControl(); // Stop generating inputs before sending the release.
            if (hadGrant) send("release_control", previous);
            statusText.textContent = reason;
            requestStatus.textContent = "다시 조작하려면 새로 신청하세요.";
        }

        socket.addEventListener("message", event => {
            let message;
            try {
                message = JSON.parse(event.data);
                if (!message || message.protocolVersion !== 2) throw new Error();
            } catch {
                connected = false;
                clearControl();
                statusText.textContent = "서버와 웹 파일 버전이 다릅니다. 두 파일을 함께 교체하세요.";
                socket.close(1008, "Protocol mismatch");
                return;
            }
            if (message.type === "controller_hello") {
                controllerId = message.controllerId;
                connected = true;
                hostOnline = message.hostOnline;
                requestStatus.textContent = hostOnline ? "닉네임을 입력하고 조작을 신청하세요." : "Unity 연결을 기다리는 중입니다.";
                renderButtons();
                return;
            }
            if (message.type === "host_status") {
                hostOnline = message.hostOnline;
                if (!hostOnline) {
                    clearControl();
                    statusText.textContent = "Unity 연결이 종료되었습니다.";
                }
                requestStatus.textContent = hostOnline ? "호스트 연결됨 · 조작을 신청하세요." : "Unity 연결을 기다리는 중입니다.";
                renderButtons();
                return;
            }
            if (message.type === "request_received" && phase === "requesting" && message.controllerId === controllerId) {
                requestId = message.requestId;
                phase = "pending";
                requestStatus.textContent = `${message.nickname} · 호스트 승인을 기다리는 중…`;
                renderButtons();
                return;
            }
            if (message.type === "request_rejected" &&
                (sameRequest(message) || (phase === "requesting" && !message.requestId))) {
                clearControl();
                requestStatus.textContent = reasons[message.reason] || "신청이 종료되었습니다.";
                return;
            }
            if (message.type === "control_granted" && phase === "pending" && sameRequest(message)) {
                grantId = message.grantId;
                phase = "approved";
                requestStatus.textContent = "호스트 승인 완료";
                statusText.textContent = "15초 안에 조작 시작을 누르세요.";
                renderButtons();
                return;
            }
            if (message.type === "control_started" && phase === "starting" &&
                sameRequest(message) && message.grantId === grantId) {
                phase = "active";
                statusText.textContent = "조작 중 · WASD / 방향키";
                renderButtons();
                sendInput();
                return;
            }
            if (message.type === "control_revoked" && sameRequest(message) && message.grantId === grantId) {
                clearControl();
                statusText.textContent = reasons[message.reason] || "조작 권한이 종료되었습니다.";
                requestStatus.textContent = "다시 조작하려면 새로 신청하세요.";
            }
        });
        socket.addEventListener("close", () => {
            connected = false;
            hostOnline = false;
            clearControl();
            requestStatus.textContent = "서버 연결 종료";
            statusText.textContent = "서버와 다른 조작 탭을 확인한 뒤 새로고침하세요.";
        });
        socket.addEventListener("error", () => {
            statusText.textContent = "연결 오류 · 서버 실행 상태를 확인하세요.";
        });
        requestButton.addEventListener("click", () => {
            if (!connected || !hostOnline || phase !== "idle") return;
            const nickname = nicknameInput.value.trim();
            if (nickname.length < 1 || nickname.length > 20) {
                requestStatus.textContent = reasons.invalid_nickname;
                return;
            }
            phase = "requesting";
            renderButtons();
            requestStatus.textContent = "신청 전송 중…";
            if (!send("request_control", { nickname })) clearControl();
        });
        startButton.addEventListener("click", () => {
            if (phase !== "approved" || document.hidden) return;
            keys.clear();
            phase = "starting";
            renderButtons();
            statusText.textContent = "조작 시작 확인 중…";
            if (!send("ready", identity())) stopControl("연결을 확인하세요.");
        });
        stopButton.addEventListener("click", () => stopControl("조작 중지 · 권한을 반환했습니다."));
        window.addEventListener("keydown", event => {
            if (phase !== "active" || !moveKeys.has(event.code)) return;
            event.preventDefault();
            if (event.repeat) return;
            keys.add(event.code);
            sendInput();
        });
        window.addEventListener("keyup", event => {
            if (phase !== "active" || !moveKeys.has(event.code)) return;
            event.preventDefault();
            keys.delete(event.code);
            sendInput();
        });
        window.addEventListener("blur", () => {
            if (phase === "active" || phase === "starting") stopControl("다른 창으로 이동하여 권한을 반환했습니다.");
        });
        document.addEventListener("visibilitychange", () => {
            if (document.hidden && ["approved", "starting", "active"].includes(phase))
                stopControl("탭이 비활성화되어 권한을 반환했습니다.");
        });
        window.addEventListener("pagehide", () => {
            if (grantId) stopControl("페이지 종료");
            socket.close();
        });
        setInterval(() => { if (phase === "active") sendInput(); }, 50);
    </script>
</body>
</html>
