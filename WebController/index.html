<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NaWaBa 원격 플레이</title>
    <style>
        * { box-sizing: border-box; }
        body { max-width: 1000px; margin: 16px auto; padding: 24px; font-family: sans-serif;
            background: #17212b; color: #eef3f8; line-height: 1.7; }
        h1 { font-size: 28px; }
        label { display: block; margin-bottom: 6px; }
        input, button { font: inherit; border-radius: 6px; padding: 10px 14px; }
        input { width: 100%; margin-bottom: 12px; }
        button { cursor: pointer; border: 1px solid #7393ad; background: #263e52;
            color: #eef3f8; margin: 0 8px 8px 0; }
        button:disabled { opacity: .4; cursor: not-allowed; }
        button:focus-visible, input:focus-visible { outline: 3px solid #80d8ff; outline-offset: 3px; }
        #input { padding: 16px; background: #263646; font-family: monospace; }
        .hint { color: #b4c8d8; font-size: 14px; }
        .video-wrap { position: relative; background: #080d12; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; }
        video { display: block; width: 100%; height: 100%; object-fit: contain; }
        #videoOverlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            pointer-events: none; text-align: center; padding: 16px; font-size: clamp(20px, 4vw, 42px);
            font-weight: bold; text-shadow: 0 2px 8px black; }
        #videoOverlay:empty { display: none; }
        #playVideo { position: absolute; bottom: 16px; left: 16px; }
        .pad { display: grid; grid-template-columns: repeat(3, 60px); gap: 6px; justify-content: center; }
        .pad button { margin: 0; touch-action: none; user-select: none; }
        .pad button[data-key="KeyW"] { grid-column: 2; }
        .pad button[data-key="KeyA"] { grid-column: 1; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <h1>NaWaBa 원격 플레이</h1>
    <p>조작을 신청하면 호스트 승인 후 게임 영상이 연결됩니다. 화면이 표시된 뒤 3초 후 시작합니다.</p>
    <label for="nickname">닉네임 (1~20자)</label>
    <input id="nickname" maxlength="20" autocomplete="off" placeholder="예: Yeonsu">
    <button id="request" disabled>조작 신청</button>
    <p id="requestStatus" role="status">서버 연결 중…</p>
    <div class="video-wrap">
        <video id="gameVideo" autoplay muted playsinline></video>
        <div id="videoOverlay">호스트 승인 대기</div>
        <button id="playVideo" hidden>영상 재생</button>
    </div>
    <p id="videoStats" class="hint">승인 후 게임 영상이 표시됩니다.</p>
    <button id="stop" disabled>조작 중지</button>
    <p id="status" role="status">승인 전에는 입력을 보낼 수 없습니다.</p>
    <p id="room" class="hint"></p>
    <div class="pad" aria-label="이동 버튼">
        <button data-key="KeyW" disabled aria-label="앞으로">▲</button>
        <button data-key="KeyA" disabled aria-label="왼쪽">◀</button>
        <button data-key="KeyS" disabled aria-label="뒤로">▼</button>
        <button data-key="KeyD" disabled aria-label="오른쪽">▶</button>
    </div>
    <p id="input">x=0, y=0</p>
    <p class="hint">WASD 또는 방향키로 조작합니다. 조작 중 다른 창·탭으로 이동하면 권한을 반환합니다.
        다시 조작하려면 새로 신청하세요. 영상 연결이 60초 안에 완료되지 않으면 취소됩니다.</p>
    <script src="/room-video.js"></script>
    <script>
    (() => {
        "use strict";
        const nicknameInput = document.getElementById("nickname");
        const requestButton = document.getElementById("request");
        const requestStatus = document.getElementById("requestStatus");
        const videoOverlay = document.getElementById("videoOverlay");
        const directionButtons = Array.from(document.querySelectorAll(".pad button"));
        const pointers = new Map();
        const stopButton = document.getElementById("stop");
        const statusText = document.getElementById("status");
        const inputText = document.getElementById("input");
        const link = new URLSearchParams(location.hash.slice(1));
        const roomId = link.get("room");
        const joinKey = link.get("join");
        if (!roomId || !/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/.test(roomId) ||
            !joinKey || !/^[a-f0-9]{64}$/.test(joinKey)) {
            requestStatus.textContent = "참가 링크가 필요합니다.";
            statusText.textContent = "호스트가 전달한 전체 참가 링크로 접속하세요.";
            return;
        }
        document.getElementById("room").textContent = `방: ${roomId.slice(0, 8)}`;
        const socket = new WebSocket(`${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/controller`);
        socket.addEventListener("open", () => {
            socket.send(JSON.stringify({ protocolVersion: 4, type: "join", roomId, joinKey }));
        });
        const keys = new Set();
        const moveKeys = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight"]);
        let connected = false;
        let hostOnline = false;
        let controllerId = "";
        let requestId = "";
        let grantId = "";
        let phase = "idle"; // idle -> requesting -> pending -> video -> starting -> active
        let sequence = 0;
        let countdownEndsAt = 0;
        let lastVideoHeartbeat = 0;
        const videoReceiver = new window.NaWaBaRoomVideoReceiver({
            video: document.getElementById("gameVideo"), stats: document.getElementById("videoStats"),
            playButton: document.getElementById("playVideo"),
            onAnswer: (id, sdp) => id === grantId && send("video_answer", { ...identity(), sdp }),
            onReady: id => { if (id === grantId) tryStartCountdown(); },
            onFailure: videoFailure,
            onStatus: text => { statusText.textContent = text; }
        });
        const reasons = {
            host_reclaimed: "호스트가 조작 권한을 회수했습니다.",
            controller_stopped: "조작을 중지했습니다.",
            controller_disconnected: "참가자 연결이 종료되었습니다.",
            host_disconnected: "호스트 연결이 종료되었습니다. 호스트에게 새 링크를 받아 주세요.",
            connection_lost: "연결이 끊겨 권한을 반환했습니다.",
            request_timeout: "30초 동안 승인되지 않아 신청이 만료되었습니다.",
            ready_timeout: "60초 안에 영상이 준비되지 않아 승인이 취소되었습니다. 다시 신청하세요.",
            video_failed: "영상 연결에 실패하거나 종료되어 조작을 중지했습니다. 다시 신청하세요.",
            video_timeout: "영상 수신이 멈춰 조작을 중지했습니다. 다시 신청하세요.",
            input_timeout: "입력 전송이 끊겨 권한을 반환했습니다.",
            invalid_nickname: "닉네임은 1~20자로 입력하세요.",
            invalid_input: "올바르지 않은 입력으로 조작이 종료되었습니다."
        };

        function renderButtons() {
            requestButton.disabled = !connected || !hostOnline || phase !== "idle";
            nicknameInput.disabled = phase !== "idle";
            for (const button of directionButtons) button.disabled = phase !== "active";
            stopButton.disabled = !connected || !["video", "starting", "active"].includes(phase);
        }
        function clearControl() {
            videoReceiver.stop();
            videoOverlay.textContent = "다시 신청하면 영상이 연결됩니다.";
            pointers.clear();
            lastVideoHeartbeat = 0;
            phase = "idle";
            requestId = "";
            grantId = "";
            keys.clear();
            sequence = 0;
            countdownEndsAt = 0;
            inputText.textContent = "x=0, y=0";
            renderButtons();
        }
        function send(type, extra = {}) {
            if (!connected || socket.readyState !== WebSocket.OPEN) return false;
            if (socket.bufferedAmount > 131072) {
                connected = false;
                clearControl();
                statusText.textContent = "전송 지연: 연결을 종료합니다. 새로고침하세요.";
                socket.close();
                return false;
            }
            socket.send(JSON.stringify({ ...extra, protocolVersion: 4, roomId, type }));
            return true;
        }
        function identity() { return { controllerId, requestId, grantId }; }
        function renderCountdown() {
            if (phase !== "starting" || !countdownEndsAt) return;
            const remaining = Math.ceil((countdownEndsAt - performance.now()) / 1000);
            const text = remaining > 0 ? `${remaining} · 잠시 후 조작을 시작합니다.` : "시작 확인 중…";
            videoOverlay.textContent = remaining > 0 ? String(remaining) : "시작 확인 중…";
            if (statusText.textContent !== text) statusText.textContent = text;
        }
        function sameRequest(message) {
            return message.controllerId === controllerId && !!requestId && message.requestId === requestId;
        }
        function sendInput() {
            if (phase !== "active") return;
            const down = code => keys.has(code) || Array.from(pointers.values()).includes(code);
            const left = down("KeyA") || down("ArrowLeft");
            const right = down("KeyD") || down("ArrowRight");
            const back = down("KeyS") || down("ArrowDown");
            const forward = down("KeyW") || down("ArrowUp");
            const x = Number(right) - Number(left);
            const y = Number(forward) - Number(back);
            if (send("input", { ...identity(), sequence: ++sequence, x, y })) {
                inputText.textContent = `x=${x}, y=${y} / 전송 번호: ${sequence}`;
            }
        }
        function stopControl(reason) {
            const previous = identity();
            const hadGrant = !!grantId;
            clearControl(); // Stop generating inputs before sending the release.
            if (hadGrant) send("release_control", previous);
            statusText.textContent = reason;
            requestStatus.textContent = "다시 조작하려면 새로 신청하세요.";
        }

        function videoFailure(reason) {
            const previous = identity();
            const hadGrant = !!grantId;
            clearControl();
            if (hadGrant) send("video_failed", previous);
            statusText.textContent = reason;
            requestStatus.textContent = "영상 연결을 확인한 뒤 다시 신청하세요.";
        }
        function tryStartCountdown() {
            if (phase !== "video" || document.hidden || !videoReceiver.isFresh()) return;
            if (!document.hasFocus()) {
                statusText.textContent = "영상 준비 완료 · 웹 화면을 클릭하면 3초 후 시작합니다.";
                return;
            }
            keys.clear();
            pointers.clear();
            phase = "starting";
            lastVideoHeartbeat = performance.now();
            statusText.textContent = "영상 준비 완료 · 카운트다운 확인 중…";
            renderButtons();
            if (!send("video_ready", identity())) stopControl("서버 연결을 확인하세요.");
        }
        window.addEventListener("focus", tryStartCountdown);
        socket.addEventListener("message", event => {
            let message;
            try {
                message = JSON.parse(event.data);
                if (!message || message.protocolVersion !== 4 || message.roomId !== roomId) throw new Error();
            } catch {
                connected = false;
                clearControl();
                statusText.textContent = "서버 버전 또는 방 정보가 다릅니다. 최신 참가 링크로 다시 접속하세요.";
                socket.close(1008, "Protocol mismatch");
                return;
            }
            if (message.type === "controller_hello") {
                controllerId = message.controllerId;
                connected = true;
                hostOnline = message.hostOnline;
                requestStatus.textContent = hostOnline ? "닉네임을 입력하고 조작을 신청하세요." : "Unity 연결을 기다리는 중입니다.";
                renderButtons();
                return;
            }
            if (message.type === "host_status") {
                hostOnline = message.hostOnline;
                if (!hostOnline) {
                    clearControl();
                    statusText.textContent = "방이 종료되었습니다. 호스트에게 새 링크를 받아 주세요.";
                }
                requestStatus.textContent = hostOnline ? "호스트 연결됨 · 조작을 신청하세요." : "방 종료";
                renderButtons();
                return;
            }
            if (message.type === "request_received" && phase === "requesting" && message.controllerId === controllerId) {
                requestId = message.requestId;
                phase = "pending";
                requestStatus.textContent = `${message.nickname} · 호스트 승인을 기다리는 중…`;
                renderButtons();
                return;
            }
            if (message.type === "request_rejected" &&
                (sameRequest(message) || (phase === "requesting" && !message.requestId))) {
                clearControl();
                requestStatus.textContent = reasons[message.reason] || "신청이 종료되었습니다.";
                return;
            }
            if (message.type === "control_granted" && phase === "pending" && sameRequest(message)) {
                grantId = message.grantId;
                phase = "video";
                requestStatus.textContent = "호스트 승인 완료";
                statusText.textContent = "게임 영상 연결 중…";
                videoOverlay.textContent = "게임 영상 연결 중…";
                renderButtons();
                if (document.hidden) { stopControl("탭이 비활성화되어 승인을 취소했습니다."); return; }
                videoReceiver.start(grantId);
                return;
            }
            if (message.type === "video_offer" && phase === "video" &&
                sameRequest(message) && message.grantId === grantId) {
                videoReceiver.acceptOffer(grantId, message.sdp);
                return;
            }
            if (message.type === "countdown_started" && phase === "starting" &&
                sameRequest(message) && message.grantId === grantId) {
                if (!Number.isFinite(message.countdownMs) || message.countdownMs < 0 || message.countdownMs > 10000) return;
                countdownEndsAt = performance.now() + message.countdownMs;
                renderCountdown();
                return;
            }
            if (message.type === "control_started" && phase === "starting" &&
                sameRequest(message) && message.grantId === grantId) {
                if (!videoReceiver.isFresh()) { videoFailure("영상 수신이 멈춰 시작을 취소했습니다."); return; }
                countdownEndsAt = 0;
                videoOverlay.textContent = "";
                phase = "active";
                statusText.textContent = "조작 중 · WASD / 방향키";
                renderButtons();
                sendInput();
                return;
            }
            if (message.type === "control_revoked" && sameRequest(message) && message.grantId === grantId) {
                clearControl();
                statusText.textContent = reasons[message.reason] || "조작 권한이 종료되었습니다.";
                requestStatus.textContent = "다시 조작하려면 새로 신청하세요.";
            }
        });
        socket.addEventListener("close", event => {
            connected = false;
            hostOnline = false;
            clearControl();
            requestStatus.textContent = "서버 연결 종료";
            if (event.reason === "Room closed") {
                statusText.textContent = "호스트 연결이 종료되어 방이 닫혔습니다. 새 참가 링크를 받아 주세요.";
            } else if (event.reason === "Invalid participant link") {
                statusText.textContent = "참가 링크가 유효하지 않습니다. 호스트에게 새 링크를 받아 주세요.";
            } else if (event.reason === "Controller already connected") {
                statusText.textContent = "이 방에는 다른 참가자 또는 조작 탭이 이미 연결되어 있습니다.";
            } else {
                statusText.textContent = "호스트에게 연결 상태를 확인하세요. 호스트가 재연결했다면 새 참가 링크가 필요합니다.";
            }
        });
        socket.addEventListener("error", () => {
            statusText.textContent = "연결 오류 · 서버 실행 상태를 확인하세요.";
        });
        requestButton.addEventListener("click", () => {
            if (!connected || !hostOnline || phase !== "idle") return;
            const nickname = nicknameInput.value.trim();
            if (nickname.length < 1 || nickname.length > 20) {
                requestStatus.textContent = reasons.invalid_nickname;
                return;
            }
            phase = "requesting";
            renderButtons();
            requestStatus.textContent = "신청 전송 중…";
            if (!send("request_control", { nickname })) clearControl();
        });
        stopButton.addEventListener("click", () => stopControl("조작 중지 · 권한을 반환했습니다."));
        window.addEventListener("keydown", event => {
            if (!["starting", "active"].includes(phase) || !moveKeys.has(event.code)) return;
            event.preventDefault();
            if (event.repeat) return;
            keys.add(event.code);
            sendInput();
        });
        window.addEventListener("keyup", event => {
            if (!["starting", "active"].includes(phase) || !moveKeys.has(event.code)) return;
            event.preventDefault();
            keys.delete(event.code);
            sendInput();
        });
        for (const button of directionButtons) {
            button.addEventListener("pointerdown", event => {
                if (phase !== "active") return;
                event.preventDefault();
                button.setPointerCapture(event.pointerId);
                pointers.set(event.pointerId, button.dataset.key);
                sendInput();
            });
            const release = event => { pointers.delete(event.pointerId); sendInput(); };
            button.addEventListener("pointerup", release);
            button.addEventListener("pointercancel", release);
            button.addEventListener("lostpointercapture", release);
        }
        window.addEventListener("blur", () => {
            if (["video", "active", "starting"].includes(phase)) stopControl("다른 창으로 이동하여 권한을 반환했습니다.");
        });
        document.addEventListener("visibilitychange", () => {
            if (document.hidden && ["video", "starting", "active"].includes(phase))
                stopControl("탭이 비활성화되어 권한을 반환했습니다.");
        });
        window.addEventListener("pagehide", () => {
            if (grantId) stopControl("페이지 종료");
            socket.close();
        });
        setInterval(() => {
            if (phase === "video") tryStartCountdown();
            if (["starting", "active"].includes(phase)) {
                if (!videoReceiver.isFresh()) { videoFailure("영상 수신이 멈춰 조작을 중지했습니다."); return; }
                if (performance.now() - lastVideoHeartbeat >= 250) {
                    lastVideoHeartbeat = performance.now();
                    send("video_alive", identity());
                }
            }
            if (phase === "active") sendInput();
            else renderCountdown();
        }, 50);
    })();
    </script>
</body>
</html>
